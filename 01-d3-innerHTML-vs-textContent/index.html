<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>D3 - XSS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="terminal-panel panel-orange">
        <h2 style="color: var(--color-orange);">[D3] Reflection XSS</h2>
        <p>测试 Payload: <code>&lt;script&gt;alert(1)&lt;/script&gt;</code></p>
        
        <input type="text" id="myInput" placeholder="Inject payload here..." autocomplete="off">
        
        <div class="btn-group">
            <button onclick="testUnsafe()" class="btn btn-orange">Execute Attack</button>
            <button onclick="testSafe()" class="btn btn-green">Defend Mode</button>
        </div>

        <h3 style="font-size: 14px; margin-top: 30px;">> OUTPUT_LOG:</h3>
        <div id="resultBox" class="terminal-output">[Awaiting input...]</div>
    </div>
    <a href="/" class="back-link">&lt; RETURN TO TERMINAL</a>
    <script src="app.js"></script>
</body>
</html>
