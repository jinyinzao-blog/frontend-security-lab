<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>D5 - CSRF 演示</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .box { border: 1px solid #ccc; padding: 15px; margin-bottom: 15px; border-radius: 5px; }
        .danger { border-color: #e74c3c; background: #fdf2f2; }
        .safe { border-color: #2ecc71; background: #f2fdf5; }
        button { padding: 8px 15px; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>
    <h2>🏦 极简模拟银行</h2>
    <p>当前余额：<strong style="font-size: 24px;" id="balance">加载中...</strong> 元</p>
    <button onclick="refreshBalance()">刷新余额</button>

    <div class="box danger">
        <h3>⚠️ 漏洞模式（无 Token 校验）</h3>
        <p>模拟黑客诱导你点击了一个恶意链接（发起 GET 请求），由于没有 Token 保护，钱直接没了。</p>
        <button onclick="unsafeTransfer()">点击链接（被攻击）</button>
        <p id="unsafe-msg"></p>
    </div>

    <div class="box safe">
        <h3>✅ 安全模式（带 Token 校验）</h3>
        <p>发起转账时，必须带上服务器发的随机 Token。黑客伪造的请求因为拿不到 Token，会被拒绝。</p>
        <button onclick="safeTransfer()">正常转账 100 元</button>
        <p id="safe-msg"></p>
    </div>

    <script>
        const balanceEl = document.getElementById('balance');
        const unsafeMsg = document.getElementById('unsafe-msg');
        const safeMsg = document.getElementById('safe-msg');

        // 刷新余额
        async function refreshBalance() {
            const res = await fetch('/api/balance');
            const data = await res.json();
            balanceEl.textContent = data.balance;
        }

        // 漏洞攻击：直接发 GET 请求
        async function unsafeTransfer() {
            const res = await fetch('/api/unsafe-transfer'); // 黑客只需要在网页里藏这样一个请求
            const data = await res.json();
            unsafeMsg.textContent = data.message + " 当前余额：" + data.balance;
            refreshBalance();
        }

        // 安全转账：先拿 Token，再发 POST 请求
        async function safeTransfer() {
            safeMsg.textContent = "正在获取 Token...";
            // 1. 先向服务器要一个 Token
            const tokenRes = await fetch('/api/token');
            const tokenData = await tokenRes.json();

            safeMsg.textContent = "正在发起转账...";
            // 2. 带着 Token 发送 POST 请求
            const res = await fetch('/api/safe-transfer', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: tokenData.token }) // 把 Token 放在请求体里
            });
            const data = await res.json();
            safeMsg.textContent = data.message + " 当前余额：" + data.balance;
            refreshBalance();
        }

        // 页面一打开就刷新一次余额
        refreshBalance();
    </script>
</body>
</html>
