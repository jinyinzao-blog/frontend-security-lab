<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>SECURE_BANK</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="terminal-panel panel-green">
        <h2 style="color: var(--color-green);">[D5] Secure Bank</h2>
        <p>STATUS: <span id="loginStatus" style="color: var(--color-red);">DISCONNECTED</span></p>
        
        <div style="margin: 40px 0; text-align: center; border: 2px solid #333; padding: 20px; background: #000;">
            <div style="font-size: 14px; color: #666; margin-bottom: 10px;">CURRENT BALANCE</div>
            <div style="font-size: 48px; font-weight: bold; color: var(--color-green);">
                ¥<span id="balance">---</span>
            </div>
        </div>
        
        <div class="btn-group">
            <button onclick="login()" class="btn btn-green">Connect / Login</button>
            <button onclick="refreshBalance()" class="btn">Refresh Data</button>
        </div>
    </div>
    <a href="/" class="back-link">&lt; RETURN TO TERMINAL</a>
    <script>
        async function login() {
            await fetch('/api/d5/login', { method: 'POST' });
            document.getElementById('loginStatus').textContent = "CONNECTED [COOKIE SET]";
            document.getElementById('loginStatus').style.color = "var(--color-green)";
            refreshBalance();
        }
        async function refreshBalance() {
            const res = await fetch('/api/d5/balance');
            const data = await res.json();
            if (res.status === 401) {
                document.getElementById('balance').textContent = "???";
                return;
            }
            document.getElementById('balance').textContent = data.balance;
        }
    </script>
</body>
</html>
