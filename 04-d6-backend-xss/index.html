<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>D6 - Stored XSS</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div class="terminal-panel panel-purple">
        <h2 style="color: var(--color-purple);">[D6] Stored XSS</h2>
        <p>测试 Payload: <code>&lt;img src=x onerror=alert(1)&gt;</code></p>

        <form id="commentForm" style="display: flex; gap: 10px;">
            <input type="text" id="commentInput" placeholder="Insert payload into database..." required autocomplete="off" style="margin-bottom: 0;">
            <button type="submit" class="btn btn-orange" style="flex: 0 0 150px;">INJECT</button>
        </form>

        <h3 style="font-size: 14px; margin-top: 30px;">> DB_OUTPUT_LOG:</h3>
        <div id="commentsList" class="terminal-output" style="border-color: rgba(209,0,255,0.3); color: var(--color-purple);"></div>
    </div>
    <a href="/" class="back-link">&lt; RETURN TO TERMINAL</a>

    <script>
        const apiUrl = '/api/d6/comments';
        async function fetchComments() {
            const res = await fetch(apiUrl);
            const comments = await res.json();
            const list = document.getElementById('commentsList');
            let html = '';
            comments.forEach(c => {
                html += `<div style="margin-bottom: 10px; border-bottom: 1px dashed #333; padding-bottom: 10px;">
                            <span style="color: #666;">[LOG]</span> ${c.text}
                         </div>`;
            });
            list.innerHTML = html || "[DB IS EMPTY]";
        }

        document.getElementById('commentForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const text = document.getElementById('commentInput').value;
            await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ text })
            });
            document.getElementById('commentInput').value = '';
            fetchComments();
        });
        fetchComments();

    
    </script>
</body>
</html>
