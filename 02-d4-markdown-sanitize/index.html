<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>D4 - Markdown</title>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .split { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        @media (max-width: 768px) { .split { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <div class="terminal-panel" style="max-width: 900px; border-color: var(--color-blue); box-shadow: 8px 8px 0 rgba(0, 229, 255, 0.2);">
        <h2 style="color: var(--color-blue);">[D4] Markdown Parser</h2>
        <p>测试 Payload: <code>&lt;img src=x onerror=alert(1)&gt;</code></p>
        
        <textarea id="input" rows="3" placeholder="Enter Markdown/HTML...">**Hello World**</textarea>
        
        <div class="btn-group" style="margin-bottom: 20px;">
            <button id="render-unsafe" class="btn btn-red">Execute innerHTML</button>
            <button id="render-safe" class="btn btn-blue">Execute DOMPurify</button>
        </div>

        <div class="split">
            <div>
                <h3 style="font-size: 14px; color: var(--color-red);">> UNSAFE_OUTPUT:</h3>
                <div id="output-unsafe" class="terminal-output" style="border-color: rgba(255,51,51,0.3);"></div>
            </div>
            <div>
                <h3 style="font-size: 14px; color: var(--color-blue);">> SAFE_OUTPUT:</h3>
                <div id="output-safe" class="terminal-output" style="border-color: rgba(0,229,255,0.3);"></div>
            </div>
        </div>
    </div>
    <a href="/" class="back-link">&lt; RETURN TO TERMINAL</a>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
