<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>D4 - Markdown 富文本 XSS 防御</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body class="container">
    <hgroup>
        <h2>实验 2：DOM 型 XSS 与 Markdown 清洗</h2>
        <p>模拟论坛留言，演示 <code>DOMPurify</code> 如何拦截恶意代码。</p>
    </hgroup>

    <article>
        <header>提示：试着输入以下 Payload</header>
        <p>尝试输入：<code>&lt;img src=x onerror=alert('XSS')&gt;</code> 或者 Markdown 语法 <code>**加粗**</code></p>
    </article>

    <label for="input">留言内容 (支持 Markdown)：</label>
    <textarea id="input" rows="4" placeholder="在这里输入留言...">Hello **Markdown**!</textarea>

    <div class="grid">
        <button id="render-unsafe" class="contrast" style="background-color: #e74c3c; border-color: #e74c3c;">⚠️ 漏洞模式（直接解析）</button>
        <button id="render-safe" style="background-color: #2ecc71; border-color: #2ecc71;">✅ 防御模式（DOMPurify清洗）</button>
    </div>

    <div class="grid">
        <article style="border-left: 4px solid #e74c3c;">
            <header>不安全输出：</header>
            <div id="output-unsafe"></div>
        </article>
        
        <article style="border-left: 4px solid #2ecc71;">
            <header>清洗后输出：</header>
            <div id="output-safe"></div>
        </article>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.0.6/purify.min.js"></script>
    <script src="app.js"></script>
</body>
</html>
